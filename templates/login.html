<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><title>Repositório Shakyra - Login</title>
<style>
body { font-family: Arial; background: #0F2240; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.login-box { background: #1b365d; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 350px; text-align: center; }
input { width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 4px; box-sizing: border-box; }
button { background: #B42828; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }
button:hover { background: #d93636; }
.error { color: #ff6b6b; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div class="login-box">
<h2>REPOSITÓRIO SHAKYRA</h2>
<p style="font-size:13px; color:#ccc;">Acesso Restrito & Protegido</p>
<form method="POST">
<input type="text" name="username" placeholder="Utilizador" required>
<input type="password" name="password" placeholder="Senha" required>
<button type="submit">Entrar no Repositório</button>
</form>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
</div>
</body>
</html>
