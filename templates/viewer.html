<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualizador Seguro - {{ title or filename }}</title>
<style>
:root {
    --primary: #0F2240;
    --accent: #B42828;
}
* { box-sizing: border-box; }
body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    background: #f1f5f9; 
    color: #1e293b; 
    margin: 0;
    padding: 20px;
    line-height: 1.7;
    user-select: none; 
    -webkit-user-select: none; 
    -moz-user-select: none; 
    -ms-user-select: none; 
}
@media print { body { display: none !important; } }

.watermark {
    position: fixed;
    top: 40%;
    left: 15%;
    font-size: 42px;
    color: rgba(180, 40, 40, 0.07);
    transform: rotate(-25deg);
    z-index: 9999;
    pointer-events: none;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.toolbar { 
    max-width: 900px;
    margin: 0 auto 20px;
    background: var(--primary); 
    color: white; 
    padding: 12px 24px; 
    border-radius: 8px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    box-shadow: 0 4px 12px rgba(15,34,64,0.15);
}
.toolbar-title {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 75%;
}
.btn-close {
    background: var(--accent); 
    color: white; 
    border: none; 
    padding: 6px 14px; 
    border-radius: 4px; 
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: background 0.2s;
}
.btn-close:hover { background: #d93636; }

.content { 
    max-width: 900px;
    margin: 0 auto;
    background: white; 
    padding: 50px 60px; 
    border: 1px solid #e2e8f0; 
    border-radius: 8px; 
    box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
}
.content h1 {
    font-size: 24px;
    color: var(--primary);
    margin-top: 0;
    margin-bottom: 16px;
    line-height: 1.3;
}
.content hr {
    border: 0;
    height: 1px;
    background: #e2e8f0;
    margin-bottom: 25px;
}
.content p {
    margin-bottom: 16px;
    font-size: 15px;
    color: #334155;
    text-align: justify;
}
.content table {
    width: 100%;
    border-collapse: collapse;
    margin: 24px 0;
    font-size: 14px;
}
.content th, .content td {
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    text-align: left;
}
.content tr:nth-child(even) {
    background: #f8fafc;
}

@media (max-width: 768px) {
    body { padding: 10px; }
    .content { padding: 25px 20px; }
    .toolbar-title { max-width: 60%; font-size: 13px; }
}
</style>
<script>
document.addEventListener('contextmenu', function(event) { event.preventDefault(); });
document.addEventListener('copy', function(event) {
    event.preventDefault(); 
    alert('Cópia de conteúdo restrita pelas políticas de segurança do Repositório Shakyra.'); 
});
document.addEventListener('keydown', function(event) {
    if (event.ctrlKey && (event.key === 'p' || event.key === 's' || event.key === 'c' || event.key === 'u')) {
        event.preventDefault();
        alert('Ação restrita pelas políticas de segurança do Repositório Shakyra.');
    }
});
</script>
</head>
<body oncontextmenu="return false;">
<div class="watermark">USO RESTRITO - {{ user }} - REPOSITÓRIO SHAKYRA</div>
<div class="toolbar">
    <div class="toolbar-title">📄 {{ title or filename }}</div>
    <button onclick="window.close()" class="btn-close">Fechar</button>
</div>
<div class="content">
{{ content | safe }}
</div>
</body>
</html>
